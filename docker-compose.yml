services:
  # Production Web container (Static export served via Nginx)
  web:
    build:
      context: .
      target: web-prod
    ports:
      - "80:80"
    restart: always

  # Development server (Metro bundler for Web & Mobile devices)
  dev:
    build:
      context: .
      target: dev
    ports:
      - "8081:8081"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
    restart: unless-stopped
